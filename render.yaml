services:
  - type: web
    name: bibliovault-ai
    runtime: node
    plan: starter
    buildCommand: apt-get update && apt-get install -y --no-install-recommends libreoffice-writer-nogui && npm install && npm run build && cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_API_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.1-70b-versatile
